<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Multiverse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <header>
        <div>
            <h1>INFINITE MULTIVERSE</h1>
            <p>EVERY CHOICE CREATES A REALITY</p>
        </div>

        <div id="dimension">DIMENSION #000000</div>
    </header>

    <main>

        <div class="scene">
            <div class="stars"></div>
            <div class="moon"></div>
            <div class="city"></div>

            <div id="location">
                LOADING...
            </div>
        </div>

        <div class="story">

            <div id="speaker">SYSTEM</div>

            <div id="text">
                Loading reality...
            </div>

            <div id="choices"></div>

        </div>

        <div class="buttons">

            <button id="backButton">
                ↩ BACKTRACK
            </button>

            <button id="mapButton">
                ◈ DIMENSION MAP
            </button>

            <button id="newButton">
                ✦ NEW STORYLINE
            </button>

            <button id="resetButton">
                ⟳ HARD RESET
            </button>

        </div>

    </main>

</div>


<div id="mapScreen">

    <div class="mapWindow">

        <button id="closeMap">×</button>

        <h2>DIMENSION MAP</h2>

        <p>
            These are the realities you have discovered.
        </p>

        <div id="mapList"></div>

    </div>

</div>


<script src="./game.js"></script>

</body>
</html>
