/* =========================

function render() {

    let scene = scenes[game.scene];

    if (!scene) {

        scene = generatedScene();

    }

    document.getElementById("story").textContent =
        game.storyline;

    document.getElementById("dimensionNumber").textContent =
        game.dimension;

    document.getElementById("speaker").textContent =
        scene.speaker;

    document.getElementById("location").textContent =
        scene.location;

    document.getElementById("text").textContent =
        scene.text;

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    scene.choices.forEach(function(choice) {

        const button =
            document.createElement("button");

        button.className = "choice";

        button.textContent =
            choice.text;

        button.onclick = function() {

            choose(choice.next);

        };

        choices.appendChild(button);

    });

}


/* =========================
   CHOICE
========================= */

function choose(next) {

    game.history.push({

        scene: game.scene,

        dimension: game.dimension,

        storyline: game.storyline

    });

    if (next === "newDimension") {

        createDimension();

    } else {

        game.scene = next;

    }

    save();

    render();

}

========================= */

function createDimension() {

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const number =
        Math.floor(Math.random() * 99) + 1;

    const letter =
        letters[
            Math.floor(Math.random() * letters.length)
        ];

    const id =
        String(number).padStart(2,"0")
        + "-"
        + letter;

    const locations = [

        "FROZEN CITY",
        "RUINED CITY",
        "SPACE STATION",
        "UNDERGROUND LAB",
        "MEGACITY",
        "OCEAN CITY",
        "DESERT COLONY",
        "DEAD FOREST",
        "UNKNOWN WORLD"

    ];

    const location =
        locations[
            Math.floor(Math.random() * locations.length)
        ];

    game.dimension = id;

    game.location = location;

    game.dimensions.push({

        id: id,

        location: location

    });

    game.scene = "generated";

    showEvent("ENTERED DIMENSION " + id);

}

/* =========================
   BACKTRACK
========================= */

function backtrack() {

    if (game.history.length === 0) {

        showEvent("NO PREVIOUS TIMELINE");

        return;

    }

    const previous =
        game.history.pop();

    game.scene =
        previous.scene;

    game.dimension =
        previous.dimension;

    game.storyline =
        previous.storyline;

    render();

    save();

    showEvent("TIMELINE REWOUND");

}

        ]

    };


    scenes.silentReason = {

        speaker: "THE ARCHIVIST",

        location: "THE WHITE ROOM",

        text:
        "The Archivist steps closer. You have already changed six universes. This is the seventh.",

        choices: [

        {
            text: "What did I change?",
            next: "event"
        },

        {
            text: "How do I undo it?",
            next: "return"
        },

        {
            text: "Leave.",
            next: "newDimension"
        }

        ]

    };


    render();

    save();

    showEvent("NEW TIMELINE CREATED");

}


/* =========================
   MAP
========================= */

function openMap() {

    const list =
        document.getElementById("dimensionList");

    list.innerHTML = "";

    game.dimensions.forEach(function(dimension) {

        const card =
            document.createElement("div");

        card.className =
            "dimensionCard";

        card.textContent =
            "Dimension " +
            dimension.id +
            " — " +
            dimension.location;

        card.onclick = function() {

            game.dimension =
                dimension.id;

            game.location =
                dimension.location;

            if (dimension.id === "73-Z") {

                game.storyline =
                    "The Silent City";

                game.scene =
                    "silentStart";

            } else if (dimension.id === "01-A") {

                game.storyline =
                    "The Fractured Rebellion";

                game.scene =
                    "start";

            } else {

                game.scene =
                    "generated";

            }

            closeMap();

            render();

            save();

        };

        list.appendChild(card);

    });

    document
        .getElementById("map")
        .classList.add("open");

}


function closeMap() {

    document
        .getElementById("map")
        .classList.remove("open");

}


/* =========================
   RESET
========================= */

function hardReset() {

    if (!confirm("Erase your entire multiverse?")) {
        return;
    }

    localStorage.removeItem("multiverseSave");

    location.reload();

}


/* =========================
   EVENTS
========================= */

let eventTimer;

function showEvent(message) {

    const event =
        document.getElementById("event");

    event.textContent = message;

    event.classList.add("show");

    clearTimeout(eventTimer);

    eventTimer = setTimeout(function() {

        event.classList.remove("show");

    },3000);

}


/* =========================
   SAVE
========================= */

function save() {

    try {

        localStorage.setItem(
            "multiverseSave",
            JSON.stringify(game)
        );

    } catch(error) {

        console.log("Save unavailable.");

    }

}


/* =========================
   LOAD
========================= */

function load() {

    try {

        const saved =
            localStorage.getItem("multiverseSave");

        if (saved) {

            const data =
                JSON.parse(saved);

            if (data && data.scene) {

                game = data;

            }

        }

    } catch(error) {

        console.log("Starting fresh.");

    }

}


/* =========================
   START
========================= */

load();

render();

console.log("GAME SUCCESSFULLY LOADED");

</script>
