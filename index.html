<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiverse: Fractured</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GAME -->
    <main id="game">

        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="game-title">
                MULTIVERSE: FRACTURED
            </div>

            <div class="universe">
                UNIVERSE <span id="universeNumber">01</span>
            </div>
        </header>


        <!-- SCENE -->
        <section id="scene">

            <!-- Background -->
            <div id="background"></div>

            <!-- Characters -->
            <div id="characters">

                <div id="alex" class="character">
                    <div class="character-body"></div>
                    <div class="character-name">ALEX</div>
                </div>

                <div id="stranger" class="character hidden">
                    <div class="character-body"></div>
                    <div class="character-name">STRANGER</div>
                </div>

            </div>


            <!-- Scene Effects -->
            <div id="darkness"></div>

            <div id="sceneText">
                <div id="location">
                    ABANDONED SUBWAY
                </div>
            </div>

        </section>


        <!-- DIALOGUE -->
        <section id="dialogue">

            <div id="speaker">
                SYSTEM
            </div>

            <div id="dialogueText">
                Loading...
            </div>

            <div id="choices"></div>

        </section>


        <!-- STATS -->
        <aside id="stats">

            <div class="stat">
                <span>ALEX</span>
                <div class="bar">
                    <div id="alexRelationship" class="fill"></div>
                </div>
            </div>

            <div class="stat">
                <span>STRANGER</span>
                <div class="bar">
                    <div id="strangerRelationship" class="fill"></div>
                </div>
            </div>

        </aside>


        <!-- TIMER -->
        <div id="timerContainer">

            <div id="timerText">
                CHOICE
            </div>

            <div id="timerBar">
                <div id="timerFill"></div>
            </div>

        </div>


        <!-- SAVE MESSAGE -->
        <div id="saveMessage">
            GAME SAVED
        </div>

    </main>


    <script src="game.js"></script>

</body>
</html>
