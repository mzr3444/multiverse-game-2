*{

}

body{

}

button{
    font-family:inherit;
}

#game{
    min-height:100vh;
    padding:25px;
    background:

}

header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:25px;
}

#title{
    font-size:26px;
    font-weight:bold;
    letter-spacing:4px;
}

#story{
    margin-top:7px;
    color:#b978ff;
    font-size:13px;
}

#dimensionBox{
    text-align:right;
}

#dimensionNumber{
    font-size:25px;
    font-weight:bold;
    color:#d28cff;
}

#dimensionName{
    color:#777;
    font-size:11px;
    letter-spacing:2px;
    margin-top:4px;
}

#scene{
    max-width:900px;
    margin:30px auto;
}

#location{
    color:#8b8b8b;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:12px;
}

#character{
    background:rgba(8,8,14,.92);
    border:1px solid #352b42;
    border-radius:6px;
    padding:28px;
    min-height:190px;
    box-shadow:0 15px 60px rgba(0,0,0,.35);
}

#speaker{
    color:#c67aff;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:18px;
}

#text{
    font-size:19px;
    line-height:1.7;
}

#choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.choice{
    min-height:65px;
    padding:17px;
    text-align:left;
    color:white;
    background:#111019;
    border:1px solid #393044;
    border-radius:5px;
    cursor:pointer;
    transition:.15s;
}

.choice:hover{
    background:#24162f;
    border-color:#bd6cff;
    transform:translateY(-2px);
}

#controls{
    max-width:900px;
    margin:25px auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.control{
    padding:12px 17px;
    color:#bbb;
    background:#0c0b11;
    border:1px solid #302a38;
    border-radius:4px;
    cursor:pointer;
}

.control:hover{
    color:#fff;
    border-color:#bd6cff;
}

#event{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#180b22;
    border:1px solid #bd6cff;
    padding:13px 25px;
    border-radius:4px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:20;
}

#event.show{
    opacity:1;
}

#map{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:10;
    align-items:center;
    justify-content:center;
}

#map.open{
    display:flex;
}

#mapBox{
    width:min(800px,92%);
    max-height:85vh;
    overflow:auto;
    background:#0b0a11;
    border:1px solid #70438e;
    padding:25px;
    border-radius:6px;
}

#mapBox h2{
    letter-spacing:3px;
}

#closeMap{
    float:right;
    background:none;
    color:white;
    border:0;
    font-size:20px;
    cursor:pointer;
}

.dimensionCard{
    padding:17px;
    margin:10px 0;
    border:1px solid #302a38;
    background:#111019;
    cursor:pointer;
    border-radius:4px;
}

.dimensionCard:hover{
    border-color:#bd6cff;
    background:#1b1322;
}

.cardTitle{
    font-weight:bold;
    color:#d18aff;
}

.cardDescription{
    color:#888;
    margin-top:5px;
    font-size:13px;
}

#loading{
    position:fixed;
    inset:0;
    background:#050509;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    transition:opacity .5s;
}

#loading.hidden{
    opacity:0;
    pointer-events:none;
}

@media(max-width:700px){

    #game{
        padding:15px;
    }

    header{
        gap:15px;
    }

    #title{
        font-size:19px;
    }

    #choices{
        grid-template-columns:1fr;
    }

    #text{
        font-size:17px;
    }

}
</style>
