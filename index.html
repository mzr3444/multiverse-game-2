```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiverse: Fractured</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050509;
            color: white;
            font-family: Arial, sans-serif;
        }

        #game {
            min-height: 100vh;
            padding: 30px;
            background:
                radial-gradient(
                    circle at center,
                    #27203a,
                    #08080d 70%
                );
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        #title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #story {
            color: #a96cff;
            font-size: 12px;
            margin-top: 5px;
        }

        #dimension {
            text-align: right;
        }

        #dimensionNumber {
            color: #c875ff;
            font-size: 24px;
            font-weight: bold;
        }

        #location {
            color: #888;
            letter-spacing: 3px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        #scene {
            max-width: 900px;
            margin: 0 auto;
        }

        #character {
            min-height: 100px;
            padding: 25px;
            margin-bottom: 20px;

            border: 1px solid #332b40;
            background: rgba(10, 10, 18, .8);
        }

        #speaker {
            color: #c875ff;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        #text {
            font-size: 18px;
            line-height: 1.6;
        }

        #choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .choice {
            padding: 18px;

            border: 1px solid #393044;
            background: #111019;
            color: white;

            cursor: pointer;

            text-align: left;
            font-size: 14px;

            transition: .15s;
        }

        .choice:hover {
            border-color: #bd6cff;
            background: #21152d;
        }

        #controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control {
            padding: 12px 18px;

            border: 1px solid #393044;
            background: #0d0c13;
            color: #aaa;

            cursor: pointer;
        }

        .control:hover {
            color: white;
            border-color: #bd6cff;
        }

        #event {
            position: fixed;
            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            padding: 12px 25px;

            background: #170d20;
            border: 1px solid #bd6cff;

            opacity: 0;
            pointer-events: none;

            transition: opacity .3s;
        }

        #event.show {
            opacity: 1;
        }

        #map {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.9);

            align-items: center;
            justify-content: center;
        }

        #map.open {
            display: flex;
        }

        #mapBox {
            width: min(700px, 90%);
            max-height: 80vh;
            overflow-y: auto;

            padding: 25px;

            background: #0b0a11;
            border: 1px solid #75449a;
        }

        .dimensionCard {
            padding: 15px;
            margin-top: 10px;

            border: 1px solid #33303d;
            cursor: pointer;
        }

        .dimensionCard:hover {
            border-color: #bd6cff;
        }

        #closeMap {
            float: right;

            background: none;
            border: none;

            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        @media(max-width: 700px) {
            #choices {
                grid-template-columns: 1fr;
            }

            #game {
                padding: 15px;
            }

            #title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header>

        <div>
            <div id="title">
                MULTIVERSE: FRACTURED
            </div>

            <div id="story">
                THE FRACTURED REBELLION
            </div>
        </div>

        <div id="dimension">
            <small>DIMENSION</small>

            <div id="dimensionNumber">
                01-A
            </div>
        </div>

    </header>


    <main id="scene">

        <div id="location">
            ABANDONED SUBWAY
        </div>

        <div id="character">

            <div id="speaker">
                SYSTEM
            </div>

            <div id="text">
                Starting the multiverse...
            </div>

        </div>


        <div id="choices"></div>


        <div id="controls">

            <button
                class="control"
                id="backtrack">
                ↩ Backtrack
            </button>

            <button
                class="control"
                id="mapButton">
                🗺 Dimension Map
            </button>

            <button
                class="control"
                id="newStory">
                ✦ New Storyline
            </button>

            <button
                class="control"
                id="reset">
                ⟳ Hard Reset
            </button>

        </div>

    </main>


    <div id="event">
        MULTIVERSE EVENT
    </div>


    <div id="map">

        <div id="mapBox">

            <button id="closeMap">
                X
            </button>

            <h2>
                DIMENSION MAP
            </h2>

            <div id="dimensionList"></div>

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
```
