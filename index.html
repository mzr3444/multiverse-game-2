<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite Multiverse</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

<header>
    <div>
        <h1>INFINITE MULTIVERSE</h1>
        <p>AN INTERACTIVE DIMENSIONAL STORY</p>
    </div>

    <div id="dimension">
        DIMENSION #000000
    </div>
</header>


<section class="scene">

    <div class="visual"></div>

    <div id="location">
        CONNECTING...
    </div>

</section>


<section class="story">

    <div id="speaker">
        SYSTEM
    </div>

    <div id="text">
        Loading reality...
    </div>

    <div id="choices"></div>

</section>


<nav>

    <button id="back">
        ↩ Backtrack
    </button>

    <button id="map">
        ◈ Dimension Map
    </button>

    <button id="new">
        ✦ New Storyline
    </button>

    <button id="reset">
        ⟳ Hard Reset
    </button>

</nav>

</div>


<div id="mapScreen" class="hidden">

    <div class="mapBox">

        <button id="closeMap">
            ×
        </button>

        <h2>
            DIMENSION MAP
        </h2>

        <p>
            Every dimension you visit appears here.
        </p>

        <div id="mapList"></div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
