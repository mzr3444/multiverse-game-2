```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiverse: Fractured</title>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loadingScreen">
    <div class="loaderRing"></div>
    <h1>MULTIVERSE</h1>
    <p>CONNECTING TO REALITIES...</p>
</div>

<div id="space"></div>

<div id="game">

    <header>

        <div>
            <div class="logo">
                MULTIVERSE<span>: FRACTURED</span>
            </div>

            <div id="storyName">
                STORYLINE
            </div>
        </div>

        <div class="dimensionInfo">
            <div class="smallLabel">CURRENT REALITY</div>

            <div id="dimensionNumber">
                01-A
            </div>

            <div id="dimensionName">
                THE ANDROID REBELLION
            </div>
        </div>

    </header>


    <section id="cinematic">

        <div id="background"></div>

        <div class="imageOverlay"></div>

        <div class="cinematicInfo">

            <div id="location">
                UNKNOWN LOCATION
            </div>

            <div id="chapter">
                CHAPTER 01
            </div>

        </div>

    </section>


    <main>

        <div id="dialogueBox">

            <div class="speakerLine">

                <div id="speaker">
                    SYSTEM
                </div>

                <div id="mood">
                    ●
                </div>

            </div>

            <div id="text">
                Connecting...
            </div>

        </div>


        <div id="choices"></div>


        <div id="controls">

            <button onclick="backtrack()">
                ↩ BACKTRACK
            </button>

            <button onclick="openMap()">
                ◈ DIMENSION MAP
            </button>

            <button onclick="newStory()">
                ✦ NEW STORYLINE
            </button>

            <button onclick="hardReset()">
                ⟳ HARD RESET
            </button>

        </div>

    </main>

</div>


<div id="eventMessage"></div>


<div id="map">

    <div id="mapWindow">

        <button id="closeMap" onclick="closeMap()">×</button>

        <h2>DIMENSION MAP</h2>

        <p class="mapSubtitle">
            Every reality contains a different story.
        </p>

        <div id="dimensionList"></div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
```
