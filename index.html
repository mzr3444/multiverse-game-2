<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Multiverse: Fractured</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #030308;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #background {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    #353552 0%,
                    #141421 45%,
                    #030308 100%
                );

            transition: 1s;
        }

        #darkness {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.7),
                    transparent 30%,
                    rgba(0,0,0,.95)
                );

            pointer-events: none;
        }

        /* TOP BAR */

        #top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 20px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 20;

            background:
                linear-gradient(
                    rgba(0,0,0,.9),
                    transparent
                );
        }

        #title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        #story {
            color: #777;
            font-size: 9px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        #dimension {
            text-align: center;
        }

        #dimension small {
            display: block;
            color: #777;
            font-size: 8px;
            letter-spacing: 3px;
        }

        #dimensionNumber {
            color: #c76cff;
            font-size: 21px;
            font-weight: bold;
        }

        /* LOCATION */

        #location {
            position: absolute;

            top: 105px;
            left: 25px;

            z-index: 15;

            color: #999;
            font-size: 9px;
            letter-spacing: 4px;
        }

        /* CHARACTERS */

        .character {
            position: absolute;

            bottom: 290px;

            width: 180px;

            text-align: center;

            opacity: 0;

            transition: .5s;

            z-index: 5;

            pointer-events: none;
        }

        .character.show {
            opacity: 1;
        }

        #alex {
            left: 18%;
        }

        #stranger {
            right: 18%;
        }

        .characterBody {
            width: 145px;
            height: 230px;

            margin: auto;

            border-radius:
                75px 75px 25px 25px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.8);
        }

        .alexBody {

            background:

                radial-gradient(
                    circle at 50% 17%,
                    #c99d82 0 12%,
                    transparent 12.5%
                ),

                linear-gradient(
                    90deg,
                    #202633,
                    #526077,
                    #202633
                );
        }

        .strangerBody {

            background:

                radial-gradient(
                    circle at 50% 17%,
                    #111 0 13%,
                    transparent 13.5%
                ),

                linear-gradient(
                    90deg,
                    #09090d,
                    #393945,
                    #09090d
                );
        }

        .characterName {
            margin-top: 8px;

            font-size: 9px;
            letter-spacing: 4px;
            color: #aaa;
        }

        /* EVENT */

        #event {

            position: absolute;

            top: 105px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            padding: 10px 20px;

            border: 1px solid #a64cff;

            background:
                rgba(15,5,25,.97);

            opacity: 0;

            pointer-events: none;

            transition: .4s;

            text-align: center;
        }

        #event.show {
            opacity: 1;
        }

        #eventTitle {
            color: #c66cff;
            font-size: 8px;
            letter-spacing: 3px;
        }

        #eventName {
            display: block;

            margin-top: 4px;

            font-size: 11px;
        }

        /* DIALOGUE */

        #dialogue {

            position: absolute;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            width: min(850px, 76%);

            z-index: 50;

            padding: 20px 25px;

            background:
                linear-gradient(
                    rgba(3,3,8,.2),
                    rgba(3,3,8,.98)
                );

            border-left: 2px solid #b45cff;

            box-shadow:
                0 -20px 70px rgba(0,0,0,.7);
        }

        #speaker {

            color: #c76cff;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 8px;
        }

        #text {

            min-height: 60px;

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 14px;
        }

        /* CHOICES */

        #choices {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .choice {

            min-height: 48px;

            padding: 11px 14px;

            background:
                rgba(16,16,25,.97);

            color: white;

            border: 1px solid #353541;

            text-align: left;

            cursor: pointer;

            font-size: 12px;

            transition: .2s;
        }

        .choice:hover {

            border-color: #c267ff;

            background:
                rgba(55,25,75,.97);

            transform: translateX(3px);
        }

        .choice::before {

            content: "◇ ";

            color: #c76cff;
        }

        /* MENU */

        #menu {

            position: absolute;

            left: 18px;
            bottom: 18px;

            z-index: 60;

            width: 160px;

            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .menuButton {

            padding: 9px;

            background:
                rgba(5,5,10,.95);

            color: #aaa;

            border: 1px solid #292934;

            cursor: pointer;

            font-size: 9px;

            text-align: left;
        }

        .menuButton:hover {

            color: white;

            border-color: #bd62ff;
        }

        /* STATUS */

        #status {

            position: absolute;

            right: 18px;
            top: 140px;

            width: 165px;

            z-index: 25;

            padding: 12px;

            background:
                rgba(5,5,10,.75);

            font-size: 9px;
        }

        .statusTitle {

            color: #777;

            font-size: 8px;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }

        .bar {

            height: 4px;

            background: #292932;

            margin-bottom: 12px;
        }

        .barFill {

            height: 100%;

            width: 50%;

            background: #bd62ff;

            transition: .4s;
        }

        /* POPUP WINDOW */

        #window {

            position: absolute;

            inset: 0;

            z-index: 200;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(0,0,0,.9);
        }

        #window.open {
            display: flex;
        }

        #windowBox {

            width: min(700px, 90%);

            max-height: 80vh;

            overflow-y: auto;

            padding: 30px;

            background: #09090f;

            border: 1px solid #74429b;
        }

        #windowBox h2 {

            color: #cf7aff;

            letter-spacing: 4px;
        }

        .card {

            padding: 14px;

            margin-top: 8px;

            background: #11111a;

            border: 1px solid #30303b;

            cursor: pointer;

            font-size: 11px;

            line-height: 1.7;
        }

        .card:hover {

            border-color: #bd62ff;
        }

        .close {

            float: right;

            background: none;

            color: #aaa;

            border: none;

            cursor: pointer;

            font-size: 16px;
        }

        /* MOBILE */

        @media(max-width: 800px) {

            #status {
                display: none;
            }

            #menu {
                display: none;
            }

            #dialogue {
                width: 94%;
            }

            #choices {
                grid-template-columns: 1fr;
            }

            #alex {
                left: 2%;
            }

            #stranger {
                right: 2%;
            }

            .characterBody {
                width: 90px;
                height: 150px;
            }

            .character {
                bottom: 330px;
            }

            #text {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

<div id="game">

    <div id="background"></div>

    <div id="darkness"></div>


    <!-- TOP -->

    <div id="top">

        <div>

            <div id="title">
                MULTIVERSE: FRACTURED
            </div>

            <div id="story">
                THE FRACTURED REBELLION
            </div>

        </div>


        <div id="dimension">

            <small>
                DIMENSION
            </small>

            <div id="dimensionNumber">
                01-A
            </div>

        </div>

    </div>


    <!-- LOCATION -->

    <div id="location">
        ABANDONED SUBWAY
    </div>


    <!-- CHARACTERS -->

    <div id="alex" class="character">

        <div class="characterBody alexBody"></div>

        <div class="characterName">
            ALEX
        </div>

    </div>


    <div id="stranger" class="character">

        <div class="characterBody strangerBody"></div>

        <div class="characterName">
            STRANGER
        </div>

    </div>


    <!-- MULTIVERSE EVENT -->

    <div id="event">

        <div id="eventTitle">
            ⚠ MULTIVERSE EVENT
        </div>

        <div id="eventName">
            THE FRACTURE
        </div>

    </div>


    <!-- STATUS -->

    <div id="status">

        <div class="statusTitle">
            REALITY STABILITY
        </div>

        <div class="bar">

            <div
                id="stabilityBar"
                class="barFill">
            </div>

        </div>


        <div class="statusTitle">
            ALEX
        </div>

        <div class="bar">

            <div
                id="alexBar"
                class="barFill">
            </div>

        </div>


        <div class="statusTitle">
            STRANGER
        </div>

        <div class="bar">

            <div
                id="strangerBar"
                class="barFill">
            </div>

        </div>

    </div>


    <!-- MENU -->

    <div id="menu">

        <button
            class="menuButton"
            onclick="backtrack()">

            ↩ BACKTRACK

        </button>


        <button
            class="menuButton"
            onclick="openMap()">

            🗺 DIMENSION MAP

        </button>


        <button
            class="menuButton"
            onclick="newStory()">

            ✦ NEW STORYLINE

        </button>


        <button
            class="menuButton"
            onclick="hardReset()">

            ⟳ HARD RESET

        </button>

    </div>


    <!-- DIALOGUE -->

    <div id="dialogue">

        <div id="speaker">
            SYSTEM
        </div>

        <div id="text">
            Loading...
        </div>

        <div id="choices"></div>

    </div>


    <!-- WINDOW -->

    <div id="window">

        <div id="windowBox">

            <button
                class="close"
                onclick="closeWindow()">

                X

            </button>

            <h2 id="windowTitle">
                DIMENSION MAP
            </h2>

            <div id="windowContent"></div>

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>

</html>
