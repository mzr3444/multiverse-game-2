<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multiverse: Fractured</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #030308;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* BACKGROUND */

#background {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            #353552 0%,
            #141421 45%,
            #030308 100%
        );

    transition: 1s;
}

#darkness {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent 30%,
            rgba(0,0,0,.95)
        );

    pointer-events: none;
}

/* TOP */

#top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;

    padding: 20px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 20;

    background: linear-gradient(
        rgba(0,0,0,.9),
        transparent
    );
}

#title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
}

#story {
    color: #777;
    font-size: 9px;
    margin-top: 5px;
    letter-spacing: 2px;
}

#dimension {
    text-align: center;
}

#dimension small {
    display: block;
    color: #777;
    font-size: 8px;
    letter-spacing: 3px;
}

#dimensionNumber {
    color: #c76cff;
    font-size: 21px;
    font-weight: bold;
}

/* LOCATION */

#location {
    position: absolute;
    top: 105px;
    left: 25px;

    z-index: 15;

    color: #999;
    font-size: 9px;
    letter-spacing: 4px;
}

/* CHARACTERS */

.character {
    position: absolute;

    bottom: 285px;

    width: 180px;

    text-align: center;

    opacity: 0;

    transition: .5s;

    z-index: 5;
}

.character.show {
    opacity: 1;
}

#alex {
    left: 18%;
}

#stranger {
    right: 18%;
}

/*
These are temporary character visuals.
We'll replace these with actual character
images after the game is working.
*/

.characterBody {
    width: 145px;
    height: 230px;

    margin: auto;

    border-radius:
        75px 75px 25px 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.8);
}

.alexBody {

    background:

        radial-gradient(
            circle at 50% 18%,
            #c99d82 0 12%,
            transparent 12.5%
        ),

        linear-gradient(
            90deg,
            #202633,
            #526077,
            #202633
        );
}

.strangerBody {

    background:

        radial-gradient(
            circle at 50% 18%,
            #111 0 13%,
            transparent 13.5%
        ),

        linear-gradient(
            90deg,
            #09090d,
            #393945,
            #09090d
        );
}

.characterName {
    margin-top: 8px;

    font-size: 9px;
    letter-spacing: 4px;
    color: #aaa;
}

/* EVENT */

#event {
    position: absolute;

    top: 105px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    padding: 9px 18px;

    border: 1px solid #a64cff;

    background: rgba(15,5,25,.95);

    opacity: 0;

    transition: .4s;

    text-align: center;
}

#event.show {
    opacity: 1;
}

#eventTitle {
    color: #c66cff;
    font-size: 8px;
    letter-spacing: 3px;
}

#eventName {
    display: block;
    margin-top: 4px;

    font-size: 11px;
}

/* DIALOGUE */

#dialogue {

    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    width: min(850px, 78%);

    z-index: 50;

    padding: 20px 25px;

    background:
        linear-gradient(
            rgba(3,3,8,.2),
            rgba(3,3,8,.97)
        );

    border-left: 2px solid #b45cff;

    box-shadow:
        0 -20px 70px rgba(0,0,0,.6);
}

#speaker {

    color: #c76cff;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 4px;

    margin-bottom: 8px;
}

#text {

    min-height: 55px;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 12px;
}

/* CHOICES */

#choices {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.choice {

    min-height: 45px;

    padding: 10px 14px;

    background:
        rgba(16,16,25,.95);

    color: white;

    border: 1px solid #353541;

    text-align: left;

    cursor: pointer;

    font-size: 12px;

    transition: .2s;
}

.choice:hover {

    border-color: #c267ff;

    background:
        rgba(55,25,75,.95);

    transform: translateX(3px);
}

.choice::before {

    content: "◇ ";

    color: #c76cff;
}

/* MENU */

#menu {

    position: absolute;

    left: 18px;
    bottom: 20px;

    z-index: 60;

    width: 155px;

    display: flex;

    flex-direction: column;

    gap: 5px;
}

.menuButton {

    padding: 9px;

    background:
        rgba(5,5,10,.9);

    color: #aaa;

    border: 1px solid #292934;

    cursor: pointer;

    font-size: 9px;

    text-align: left;
}

.menuButton:hover {

    color: white;

    border-color: #bd62ff;
}

/* STATUS */

#status {

    position: absolute;

    right: 18px;
    top: 140px;

    width: 165px;

    z-index: 25;

    padding: 12px;

    background:
        rgba(5,5,10,.7);

    font-size: 9px;
}

.statusTitle {

    color: #777;

    font-size: 8px;

    letter-spacing: 3px;

    margin-bottom: 8px;
}

.bar {

    height: 4px;

    background: #292932;

    margin-bottom: 12px;
}

.barFill {

    height: 100%;

    width: 50%;

    background: #bd62ff;

    transition: .4s;
}

/* WINDOWS */

#window {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    background: rgba(0,0,0,.9);
}

#window.open {

    display: flex;
}

#windowBox {

    width: min(700px, 90%);

    max-height: 80vh;

    overflow-y: auto;

    padding: 30px;

    background: #09090f;

    border: 1px solid #74429b;
}

#windowBox h2 {

    color: #cf7aff;

    letter-spacing: 4px;
}

.card {

    padding: 14px;

    margin-top: 8px;

    background: #11111a;

    border: 1px solid #30303b;

    cursor: pointer;

    font-size: 11px;

    line-height: 1.7;
}

.card:hover {

    border-color: #bd62ff;
}

.close {

    float: right;

    background: none;

    color: #aaa;

    border: none;

    cursor: pointer;

    font-size: 16px;
}

/* MOBILE */

@media(max-width: 800px) {

    #status {
        display: none;
    }

    #menu {
        display: none;
    }

    #dialogue {
        width: 94%;
    }

    #choices {
        grid-template-columns: 1fr;
    }

    #alex {
        left: 2%;
    }

    #stranger {
        right: 2%;
    }

    .characterBody {
        width: 100px;
        height: 160px;
    }

}

</style>
</head>


<body>

<div id="game">

    <div id="background"></div>

            THE FRACTURE
        </div>

    </div>


    <!-- STATUS -->

    <div id="status">

        <div class="bar">

                class="barFill"

        </div>


        <div class="statusTitle">
            ALEX
        </div>

        <div class="bar">

        </div>


        <div class="statusTitle">

    </div>


    <!-- MENU -->

    <div id="menu">

            DIMENSION MAP

        <button

    <div id="dialogue">

            SYSTEM
        </div>

            Loading...

        <div id="choices"></div>

    <!-- WINDOW -->

    <div id="window">

        <div id="windowBox">

            <button
                class="close"

                X
            </button>

            <h2 id="windowTitle">
                DIMENSION MAP
            </h2>

            <div id="windowContent"></div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   GAME DATA
================================================== */

let game = {

    storyline:
        "The Fractured Rebellion",

    dimension:
        "01-A",

    stability:
        100,

    alex:
        50,

    stranger:
        50,

    scene:
        "intro",

    dimensions: [

        {
            id: "01-A",

            location:
                "Abandoned Subway",

            stability:
                100
        }

    ],

    events: []

};


/* ==================================================
   SAVE
================================================== */

function save() {

    localStorage.setItem(
        "multiverseGame",
        JSON.stringify(game)
    );

}


/* ==================================================
   LOAD
================================================== */

function load() {

    let saved =
        localStorage.getItem(
            "multiverseGame"
        );

    if (saved) {

        try {

            game =
                JSON.parse(saved);

        }

        catch {

            console.log(
                "Save was damaged. Starting new game."
            );

        }

    }

}

/* ==================================================
   APPLY EFFECT
================================================== */

function applyEffect(effect) {

    if (!effect) return;

    let parts =
        effect.split(":");

    let type =
        parts[0];

    let amount =
        Number(parts[1]);


    if (type === "stability") {

        game.stability += amount;

        game.stability =
            Math.max(
                0,
                Math.min(
                    100,
                    game.stability
                )
            );

    }


    if (type === "alex") {

        game.alex += amount;

        game.alex =
            Math.max(
                0,
                Math.min(
                    100,
                    game.alex
                )
            );

    }


    if (type === "stranger") {

        game.stranger += amount;

        game.stranger =
            Math.max(
                0,
                Math.min(
                    100,
                    game.stranger
                )
            );

    }

}


/* ==================================================
   CHOOSE
================================================== */

function choose(choice) {

    applyEffect(
        choice.effect
    );


    /*
    SPECIAL:
    New dimension
    */

    if (
        choice.next ===
        "newDimension"
    ) {

        createDimension();

        game.scene =
            "newDimension";

    }

    else {

        game.scene =
            choice.next;

    }


    /*
    Low stability causes a
    multiverse event.
    */

    if (
        game.stability <= 15 &&
        game.scene !== "event"
    ) {

        createEvent();

    }


    save();

    render();

}


/* ==================================================
   CREATE DIMENSION
================================================== */

function createDimension() {

    let letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    let id;


    do {

        let number =
            Math.floor(
                Math.random() * 99
            ) + 1;

        let letter =
            letters[
                Math.floor(
                    Math.random() *
                    letters.length
                )
            ];

        id =
            String(number).padStart(
                2,
                "0"
            )
            + "-"
            + letter;

    }

    while (
        game.dimensions.some(
            d => d.id === id
        )
    );


    let locations = [

        "Ruined Downtown",

        "Frozen City",

        "Underground Laboratory",

        "Desert Research Facility",

        "Broken Space Station",

        "Unknown Colony",

        "Dead Forest",

        "Abandoned Research Facility"

    ];


    let dimension = {

        id: id,

        location:
            locations[
                Math.floor(
                    Math.random() *
                    locations.length
                )
            ],

        stability:
            Math.floor(
                50 +
                Math.random() * 50
            )

    };


    game.dimensions.push(
        dimension
    );


    game.dimension =
        dimension.id;


    game.stability =
        dimension.stability;

}


/* ==================================================
   MULTIVERSE EVENT
================================================== */

function createEvent() {

    let events = [

        "THE FRACTURE",

        "THE CONVERGENCE",

        "THE PARADOX",

        "THE TIMELINE WAR",

        "THE GREAT COLLAPSE",

        "THE INVERSION",

        "THE VOID"

    ];


    let name =
        events[
            Math.floor(
                Math.random() *
                events.length
            )
        ];


    game.events.push({

        name:
            name,

        affected:
            []

    });


    /*
    Affect most dimensions.
    */

    game.dimensions.forEach(
        dimension => {

            if (
                Math.random() <
                .75
            ) {

                dimension.stability =
                    Math.max(
                        0,
                        dimension.stability -
                        Math.floor(
                            Math.random() * 20
                        )
                    );

                game.events[
                    game.events.length - 1
                ].affected.push(
                    dimension.id
                );

            }

        }
    );


    showEvent(
        name
    );

}


/* ==================================================
   RENDER
================================================== */

function render() {

    let scene =
        scenes[game.scene];


    if (!scene) {

        console.error(
            "Scene doesn't exist:",
            game.scene
        );

        game.scene =
            "intro";

        scene =
            scenes.intro;

    }


    document.getElementById(
        "speaker"
    ).textContent =
        scene.speaker;


    document.getElementById(
        "text"
    ).textContent =
        scene.text;


    document.getElementById(
        "location"
    ).textContent =
        scene.location;


    document.getElementById(
        "dimensionNumber"
    ).textContent =
        game.dimension;


    /*
    Characters
    */

    document.getElementById(
        "alex"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "stranger"
    ).classList.remove(
        "show"
    );


    if (
        scene.character ===
        "alex"
    ) {

        document.getElementById(
            "alex"
        ).classList.add(
            "show"
        );

    }


    if (
        scene.character ===
        "stranger"
    ) {

        document.getElementById(
            "stranger"
        ).classList.add(
            "show"
        );

    }


    /*
    Choices
    */

    let choices =
        document.getElementById(
            "choices"
        );


    choices.innerHTML = "";


    scene.choices.forEach(
        choice => {

            let button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.textContent =
                choice.text;


            button.onclick =
                function() {

                    choose(
                        choice
                    );

                };


            choices.appendChild(
                button
            );

        }
    );


    /*
    Status
    */

    document.getElementById(
        "stabilityBar"
    ).style.width =
        game.stability + "%";


    document.getElementById(
        "alexBar"
    ).style.width =
        game.alex + "%";


    document.getElementById(
        "strangerBar"
    ).style.width =
        game.stranger + "%";


    /*
    Change background
    */

    let hue =
        Math.floor(
            Math.random() * 360
        );


    document.getElementById(
        "background"
    ).style.background =
        `
        radial-gradient(
            circle at center,
            hsl(${hue},30%,25%),
            #141421 48%,
            #030308 100%
        )
        `;

}


/* ==================================================
   EVENT DISPLAY
================================================== */

function showEvent(name) {

    let event =
        document.getElementById(
            "event"
        );


    document.getElementById(
        "eventName"
    ).textContent =
        name;


    event.classList.add(
        "show"
    );


    setTimeout(
        function() {

            event.classList.remove(
                "show"
            );

        },
        5000
    );

}


/* ==================================================
   MAP
================================================== */

function openMap() {

    let content =
        document.getElementById(
            "windowContent"
        );


    document.getElementById(
        "windowTitle"
    ).textContent =
        "DIMENSION MAP";


    content.innerHTML = "";


    game.dimensions.forEach(
        dimension => {

            let card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <strong>
                    DIMENSION ${dimension.id}
                </strong>

                <br>

                Location:
                ${dimension.location}

                <br>

                Stability:
                ${dimension.stability}%

            `;


            card.onclick =
                function() {

                    game.dimension =
                        dimension.id;

                    game.stability =
                        dimension.stability;

                    game.scene =
                        "return";

                    save();

                    closeWindow();

                    render();

                };


            content.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "window"
    ).classList.add(
        "open"
    );

}

================================================== */

    let answer =
        confirm(
            "Start a completely new storyline?"
        );


    if (answer) {

    }

}


/* ==================================================
   WINDOW
================================================== */

function closeWindow() {

    document.getElementById(
        "window"
    ).classList.remove(
        "open"
    );

}

   START
================================================== */

load();
